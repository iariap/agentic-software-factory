name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync deps
        run: uv sync
      - name: Ruff (lint + format)
        run: |
          uv run ruff check scripts/
          uv run ruff format --check scripts/
      - name: Ty (types)
        run: uv run ty check scripts/
      - name: "Harness tests (unittest, sin red: fakes de gh/gcloud)"
        run: python3 scripts/test_harness.py
      - name: Syntax de shell
        run: |
          shopt -s nullglob
          for f in scripts/*.sh scripts/apps/*/*.sh; do bash -n "$f"; done
      - name: Sanity de mermaid en README (bloques balanceados)
        run: |
          python3 - <<'PY'
          import re, sys
          md = open("README.md").read()
          fences = len(re.findall(r"^```", md, re.M))
          if fences % 2:
              sys.exit(f"fences de codigo desbalanceados: {fences}")
          blocks = re.findall(r"```mermaid\n(.*?)```", md, re.S)
          print(f"{len(blocks)} diagramas mermaid, fences OK")
          PY
